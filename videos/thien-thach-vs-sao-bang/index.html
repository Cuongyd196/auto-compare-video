<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>So sánh kiến thức — Thiên thạch vs Sao băng</title>
    <link rel="stylesheet" href="../css/fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      #glow-top {
        width: 560px;
        height: 560px;
        left: 260px;
        top: 120px;
        background: radial-gradient(
          circle,
          rgba(255, 79, 163, 0.35) 0%,
          rgba(255, 79, 163, 0) 70%
        );
      }
      #glow-bottom {
        width: 640px;
        height: 640px;
        left: 220px;
        top: 1085px;
        background: radial-gradient(
          circle,
          rgba(55, 230, 196, 0.28) 0%,
          rgba(55, 230, 196, 0) 70%
        );
      }
      #ghost-word {
        position: absolute;
        top: 796px;
        left: -60px;
        width: 1200px;
        font-family: 'Be Vietnam Pro', sans-serif;
        font-weight: 900;
        font-size: 220px;
        color: var(--fg);
        opacity: 0.035;
        letter-spacing: 4px;
        white-space: nowrap;
      }

      #card-left {
        left: 120px;
      }
      #card-right {
        left: 560px;
      }
      /* meteorite icon */
      #rock {
        width: 220px;
        height: 190px;
        background: linear-gradient(
          155deg,
          #8a7666 0%,
          #5a4b3e 55%,
          #3c3128 100%
        );
        clip-path: polygon(
          18% 8%,
          52% 0%,
          86% 14%,
          100% 46%,
          88% 78%,
          58% 100%,
          22% 94%,
          0% 60%,
          4% 28%
        );
      }
      .crater {
        position: absolute;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.28);
      }
      #crater-1 {
        width: 30px;
        height: 30px;
        top: 210px;
        left: 190px;
      }
      #crater-2 {
        width: 18px;
        height: 18px;
        top: 265px;
        left: 235px;
      }
      #ground-line {
        position: absolute;
        bottom: 0;
        left: 40px;
        width: 320px;
        height: 4px;
        background: var(--panel-edge);
        border-radius: 2px;
      }
      /* shooting star icon */
      #sky {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0e1330 0%, #191f42 100%);
        border-radius: 20px 20px 0 0;
      }
      #star {
        width: 60px;
        height: 60px;
        background: var(--fg);
        clip-path: polygon(
          50% 0%,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 57%,
          2% 35%,
          39% 35%
        );
        box-shadow: 0 0 30px 6px rgba(255, 255, 255, 0.5);
      }
      #streak {
        position: absolute;
        width: 340px;
        height: 10px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.9) 100%
        );
        border-radius: 6px;
        transform: rotate(-32deg);
        filter: blur(1px);
      }
      .twinkle {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--fg);
        opacity: 0.6;
      }

      /* VS badge */
      #vs-badge {
        position: absolute;
        top: 355px;
        left: 485px;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: var(--accent-pink);
        display: grid;
        place-items: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        z-index: 5;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
      #vs-badge span {
        font-weight: 900;
        font-size: 34px;
        color: var(--bg);
        letter-spacing: 0.02em;
      }

      /* payoff verdict badges */
      .verdict-badge {
        position: absolute;
        top: 40px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 900;
        font-size: 32px;
        z-index: 6;
        transform-origin: 50% 50%;
        opacity: 0;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      }
      #verdict-left {
        left: 389px;
        background: var(--accent-cyan);
        color: #2a1e00;
      }
      #verdict-right {
        left: 829px;
        background: var(--panel-edge);
        color: var(--fg);
      }

      /* ---------- middle caption zone (y 840-1300) ---------- */
      /* shared styles moved to ../css/shared.css */

      /* ---------- bottom avatar zone (y 1320-1920) ---------- */
      /* shared styles moved to ../css/shared.css */
    </style>
  </head>
  <body>
    <div

      id="root"

      data-start="0"
      data-width="1080"

      <section

            <div
              data-hf-id="hf-hx1j"

            ></div>
            <div data-hf-id="hf-f3wz" id="streak"></div>

        <div data-hf-id="hf-jfsi" id="vs-badge">

        <div data-hf-id="hf-98lu" id="verdict-right" class="verdict-badge">

        <!-- middle: captions -->
        <div data-hf-id="hf-n7e7" id="eyebrow">Cường IT</div>
        <div data-hf-id="hf-7yco" id="caption-zone">
          <div data-hf-id="hf-ltvs" class="caption-line" id="line-1">
            <span data-hf-id="hf-xpmn" class="caption-line-text"
              >Đây là
              <span
                data-hf-id="hf-0q43"
                class="kw"
                style="color: var(--accent-cyan)"
                >THIÊN THẠCH</span
              ></span
            >
          </div>
          <div data-hf-id="hf-bkjz" class="caption-line" id="line-2">
            <span data-hf-id="hf-25tr" class="caption-line-text"
              >Đây là
              <span
                data-hf-id="hf-y8f1"
                class="kw"
                style="color: var(--accent-cyan)"
                >SAO BĂNG</span
              ></span
            >
          </div>
          <div data-hf-id="hf-kvwg" class="caption-line" id="line-3">
            <span data-hf-id="hf-v4nr" class="caption-line-text"
              >Sự khác nhau là gì?</span

          </div>
          <div data-hf-id="hf-vdjr" class="caption-line" id="line-4">
            <span data-hf-id="hf-i7n5" class="caption-line-text"
              >Thiên thạch là
              <span data-hf-id="hf-ul34" class="kw">ĐÁ</span> hoặc
              <span data-hf-id="hf-5ao0" class="kw">KIM LOẠI</span> từ vũ
              trụ</span
            >
          </div>
          <div data-hf-id="hf-5bn9" class="caption-line" id="line-5">
            <span data-hf-id="hf-67uw" class="caption-line-text"
              >Nó thực sự
              <span data-hf-id="hf-ytvu" class="kw">RƠI XUỐNG</span> và chạm
              đất</span
            >
          </div>
          <div data-hf-id="hf-zz99" class="caption-line" id="line-6">
            <span data-hf-id="hf-pl4h" class="caption-line-text"
              >Còn sao băng chỉ là
              <span data-hf-id="hf-rsqv" class="kw">ÁNH SÁNG</span> thôi</span
            >
          </div>
          <div data-hf-id="hf-9979" class="caption-line" id="line-7">
            <span data-hf-id="hf-9kxo" class="caption-line-text"
              >Đó là bụi vũ trụ đang
              <span data-hf-id="hf-k24u" class="kw">CHÁY</span> trong khí
              quyển</span
            >
          </div>
          <div data-hf-id="hf-3xoz" class="caption-line" id="line-8">
            <span data-hf-id="hf-kp3y" class="caption-line-text"
              >Một cái <span data-hf-id="hf-v5wf" class="kw">CHẠM ĐẤT</span> —
              một cái thì
              <span data-hf-id="hf-53kr" class="kw">KHÔNG!</span></span
            >
          </div>
        </div>

        <!-- bottom: 2D avatar host -->
        <div data-hf-id="hf-bs5l" id="avatar-host">
          <div data-hf-id="hf-4617" id="avatar-body">
            <div data-hf-id="hf-cl01" id="chest-light"></div>
          </div>
          <div data-hf-id="hf-9f5w" id="arm-left" class="arm">
            <div data-hf-id="hf-foeb" class="hand"></div>
          </div>
          <div data-hf-id="hf-2ovv" id="arm-right" class="arm">
            <div data-hf-id="hf-xbk3" class="hand"></div>
          </div>
          <div data-hf-id="hf-bf2l" id="avatar-head">
            <div data-hf-id="hf-an01" id="antenna-stem"></div>
            <div data-hf-id="hf-an02" id="antenna-tip"></div>
            <div data-hf-id="hf-vs01" id="visor"></div>
            <div data-hf-id="hf-y4ty" class="eye" id="eye-left"></div>
            <div data-hf-id="hf-7vpp" class="eye" id="eye-right"></div>
            <div data-hf-id="hf-6l22" id="mouth"></div>
          </div>
        </div>
      </section>

      <!-- narration: Vbee TTS, one clip per caption line, direct root children -->
      <audio
        data-hf-id="hf-i3lk"
        id="vo-1"
        src="assets/vo/line-1.mp3"
        data-start="0.55"
        data-duration="1.032"
        data-track-index="20"
      ></audio>
      <audio
        data-hf-id="hf-oz0m"
        id="vo-2"
        src="assets/vo/line-2.mp3"
        data-start="1.932"
        data-duration="1.008"
        data-track-index="20"
      ></audio>
      <audio
        data-hf-id="hf-dty4"
        id="vo-3"
        src="assets/vo/line-3.mp3"
        data-start="3.39"
        data-duration="1.224"
        data-track-index="20"
      ></audio>
      <audio
        data-hf-id="hf-zw7d"
        id="vo-4"
        src="assets/vo/line-4.mp3"
        data-start="5.014"
        data-duration="1.992"
        data-track-index="20"
      ></audio>
      <audio
        data-hf-id="hf-52he"
        id="vo-5"
        src="assets/vo/line-5.mp3"
        data-start="7.306"
        data-duration="1.728"
        data-track-index="20"
      ></audio>
      <audio
        data-hf-id="hf-elgq"
        id="vo-6"
        src="assets/vo/line-6.mp3"
        data-start="9.434"
        data-duration="1.632"
        data-track-index="20"
      ></audio>
      <audio
        data-hf-id="hf-f54g"
        id="vo-7"
        src="assets/vo/line-7.mp3"
        data-start="11.366"
        data-duration="1.992"
        data-track-index="20"
      ></audio>
      <audio
        data-hf-id="hf-9y0e"
        id="vo-8"
        src="assets/vo/line-8.mp3"
        data-start="13.758"
        data-duration="1.944"
        data-track-index="20"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- entrance (0.0 - 0.75s) ----------
      tl.fromTo(
        '#card-left',
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: 'power3.out' },
        0.0,
      );
      tl.fromTo(
        '#card-right',
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: 'power3.out' },
        0.15,
      );
      tl.fromTo(
        '#vs-badge',
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: 'power3.out' },
        0.45,
      );
      tl.fromTo(
        '#avatar-host',
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: 'power3.out' },
        0.1,
      );
      tl.fromTo(
        '#eyebrow',
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' },
        0.15,
      );

      // ---------- caption line helper ----------
      const { showLine, pose, headTilt, talk } = window.__comparisonVideoShared;

      // Arm geometry note: both arm divs hang straight down at rotation:0 (identical
      // local coordinates), so they are NOT mirrored automatically. A POSITIVE rotation
      // swings the LEFT arm outward-left; a NEGATIVE rotation swings the RIGHT arm
      // outward-right. Always pass opposite-signed magnitudes for a mirrored pose.

      // ---------- VO-driven beat timing ----------
      // Real Vbee clip durations (assets/vo/durations.json) drive every beat —
      // caption pop-in, avatar pose, and the mouth-talk window all key off each
      // clip's actual [start, start+duration], not an estimate.
      const VO = {
        1: { start: 0.55, dur: 1.032 },
        2: { start: 1.932, dur: 1.008 },
        3: { start: 3.39, dur: 1.224 },
        4: { start: 5.014, dur: 1.992 },
        5: { start: 7.306, dur: 1.728 },
        6: { start: 9.434, dur: 1.632 },
        7: { start: 11.366, dur: 1.992 },
        8: { start: 13.758, dur: 1.944 },
      };
      const capOut = (n) => VO[n].start + VO[n].dur + 0.25;

      // ---------- BEAT 1: HOOK ----------
      pose(115, -8, VO[1].start, 0.3);
      showLine('#line-1', VO[1].start, capOut(1));
      talk(VO[1].start, VO[1].start + VO[1].dur);

      pose(8, -115, VO[2].start, 0.3);
      showLine('#line-2', VO[2].start, capOut(2));
      talk(VO[2].start, VO[2].start + VO[2].dur);

      // ---------- BEAT 2: QUESTION ----------
      pose(55, -55, VO[3].start, 0.35);
      headTilt(6, VO[3].start, 0.35);
      showLine('#line-3', VO[3].start, capOut(3));
      talk(VO[3].start, VO[3].start + VO[3].dur);
      headTilt(0, capOut(3), 0.3);

      // ---------- BEAT 3: GIẢI A ----------
      tl.to(
        '#card-left',
        { scale: 1.05, opacity: 1, duration: 0.4, ease: 'power2.out' },
        VO[4].start,
      );
      tl.to(
        '#card-right',
        { scale: 0.96, opacity: 0.55, duration: 0.4, ease: 'power2.out' },
        VO[4].start,
      );
      pose(75, -8, VO[4].start, 0.3);
      showLine('#line-4', VO[4].start, capOut(4));
      talk(VO[4].start, VO[4].start + VO[4].dur);
      showLine('#line-5', VO[5].start, capOut(5));
      talk(VO[5].start, VO[5].start + VO[5].dur);

      // ---------- BEAT 4: GIẢI B ----------
      tl.to(
        '#card-left',
        { scale: 0.96, opacity: 0.55, duration: 0.4, ease: 'power2.out' },
        VO[6].start,
      );
      tl.to(
        '#card-right',
        { scale: 1.05, opacity: 1, duration: 0.4, ease: 'power2.out' },
        VO[6].start,
      );
      pose(8, -75, VO[6].start, 0.3);
      showLine('#line-6', VO[6].start, capOut(6));
      talk(VO[6].start, VO[6].start + VO[6].dur);
      showLine('#line-7', VO[7].start, capOut(7));
      talk(VO[7].start, VO[7].start + VO[7].dur);

      // ---------- BEAT 5: PAYOFF ----------
      tl.to(
        '#card-left',
        { scale: 1, opacity: 1, duration: 0.4, ease: 'power2.out' },
        VO[8].start,
      );
      tl.to(
        '#card-right',
        { scale: 1, opacity: 1, duration: 0.4, ease: 'power2.out' },
        VO[8].start,
      );
      pose(8, -8, VO[8].start, 0.3);
      tl.fromTo(
        '#avatar-body',
        { scale: 1 },
        {
          scale: 1.04,
          duration: 0.3,
          ease: 'power2.out',
          yoyo: true,
          repeat: 1,
        },
        VO[8].start,
      );
      tl.fromTo(
        '#verdict-left',
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: 'power3.out' },
        VO[8].start + 0.15,
      );
      tl.fromTo(
        '#verdict-right',
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: 'power3.out' },
        VO[8].start + 0.25,
      );
      showLine('#line-8', VO[8].start, null); // holds to the end — no exit, this is the payoff
      talk(VO[8].start, VO[8].start + VO[8].dur);

      // ---------- ambient background glows (finite, phase-opposed) ----------
      const ROOT_DURATION = 17;
      const glowCycle = 3.2;
      const glowReps = Math.max(0, Math.floor(ROOT_DURATION / glowCycle) - 1);
      tl.fromTo(
        '#glow-top',
        { opacity: 0.6 },
        {
          opacity: 1,
          duration: glowCycle / 2,
          ease: 'sine.inOut',
          yoyo: true,
          repeat: glowReps,
        },
        0,
      );
      tl.fromTo(
        '#glow-bottom',
        { opacity: 1 },
        {
          opacity: 0.6,
          duration: glowCycle / 2,
          ease: 'sine.inOut',
          yoyo: true,
          repeat: glowReps,
        },
        0,
      );

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
